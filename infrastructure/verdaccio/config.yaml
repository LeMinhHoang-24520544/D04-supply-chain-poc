storage: /verdaccio/storage/data
plugins: /verdaccio/plugins

web:
  enable: true
  title: "UIT Private Registry - Supply Chain Lab"

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 1000

# Air-gap configuration: No external uplinks to public npmjs.org
# Ensures isolated environment per NT230 safety rules
uplinks: {}

packages:
  '@*/*':
    access: $all
    publish: $all
    unpublish: $all

  '**':
    access: $all
    publish: $all
    unpublish: $all

server:
  keepAliveTimeout: 60

middlewares:
  audit:
    enabled: true

logs:
  - { type: stdout, format: pretty, level: http }
